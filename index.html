<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elif-Ba | Ayetin Vakti</title>
<meta name="description" content="Kur'an okumayı adım adım öğren: 28 harf, harekeler, cezim, şedde, tenvin, med ve Kur'an'dan dualar. Her yaş için.">
<link rel="canonical" href="https://ayetinvakti.github.io/elif-ba/">
<meta property="og:title" content="Elif-Ba | Ayetin Vakti">
<meta property="og:description" content="Kur'an okumayı adım adım öğren.">
<meta property="og:image" content="https://ayetinvakti.github.io/og-image.png">
<meta name="theme-color" content="#0f172a">
<script src="https://ayetinvakti.github.io/menu.js" defer></script>
<style>
:root{--bg:#0f172a;--card-bg:#1e293b;--drawer-bg:#1e293b;--text-color:#f8fafc;--text-muted:#94a3b8;--accent-color:#00bcd4;--line:rgba(128,128,128,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html.light-mode{--bg:#f1f5f9;--card-bg:#fff;--drawer-bg:#fff;--text-color:#0f172a;--text-muted:#64748b;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text-color);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card-bg);color:var(--text-color);font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;font-family:inherit}
.sp{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
main{max-width:720px;margin:0 auto;padding:0 14px 40px}
.hero{font-size:22px;font-weight:800;margin:6px 0 2px}
.sub{color:var(--text-muted);font-size:13px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card-bg);color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tab[aria-selected=true]{background:var(--accent-color);color:#fff;border-color:transparent}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0 4px}
.prog i{display:block;height:100%;background:var(--accent-color);width:0;transition:width .3s}
.pt{font-size:12px;color:var(--text-muted);margin-bottom:12px}
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lt{position:relative;padding:10px 2px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card-bg);color:var(--text-color);cursor:pointer;text-align:center;font-family:inherit}
.lt .a{display:block;font-size:34px;line-height:1.5}
.lt .n{font-size:12px;color:var(--text-muted)}
.lt.on{border-color:var(--accent-color)}
.lt.ok::after{content:"✓";position:absolute;top:4px;right:7px;font-size:12px;color:var(--accent-color);font-weight:800}
.ar{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;direction:rtl}
.big{font-size:84px;line-height:1.4;text-align:center}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:6px 0}
.forms .ar{font-size:34px;line-height:1.5}
.forms small,.hk small{display:block;font-size:11px;color:var(--text-muted)}
.bd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.bd span{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--text-muted)}
.bd .k{border-color:var(--accent-color);color:var(--accent-color)}
.hk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.hk .ar{font-size:40px;line-height:1.5}
.btn{width:100%;padding:11px;border-radius:12px;border:none;background:var(--accent-color);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px}
.btn.o{background:transparent;border:1px solid var(--accent-color);color:var(--accent-color)}
h3{margin:0 0 4px;font-size:16px}
.d{margin:2px 0 8px;font-size:14px}
.gt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin:16px 2px 8px}
.dr{display:flex;align-items:center;gap:8px}
.dr b{flex:1;font-size:15px}
.dr em{font-style:normal;font-size:12px;color:var(--text-muted)}
.ay{border-top:1px solid var(--line);padding:10px 0}
.ay .ar{font-size:28px;line-height:1.9;text-align:right}
.ay p{margin:4px 0;font-size:14px}
.pl{border:1px solid var(--accent-color);color:var(--accent-color);background:transparent;border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.src{font-size:12px;color:var(--text-muted);margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="bar">
<a class="icon-btn" href="https://ayetinvakti.github.io/" aria-label="Ana sayfa">←</a>
<button class="icon-btn" data-drawer-toggle aria-label="Menü">☰</button>
<span class="sp"></span>
<button class="icon-btn" id="th" aria-label="Tema">◐</button>
</div>
<main>
<h1 class="sr">Elif-Ba</h1>
<div class="hero" id="hero"></div>
<p class="sub" id="sub"></p>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="prog"><i id="pb"></i></div>
<div class="pt" id="pt"></div>
<section id="p0"></section>
<section id="p1" hidden></section>
<section id="p2" hidden></section>
<p class="src" id="src"></p>
</main>
<script>
(function(){
var T={
tr:{hero:'Elif-Ba',sub:'Kur\'an okumayı adım adım öğren. Her yaş için.',t0:'Harfler',t1:'Harekeler',t2:'Dualar',lr:'Öğrendim',un:'Öğrenmedim',pg:'öğrenildi',pick:'Bir harfe dokun',s0:'Tek',s1:'Başta',s2:'Ortada',s3:'Sonda',th:'Kalın harf',in:'İnce harf',nj:'Sonraki harfe bitişmez',jn:'Sonraki harfe bitişir',hh:'Harekeli okunuşu',ld:'Yükleniyor…',er:'Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene.',open:'Aç',close:'Kapat',all:'Hepsini dinle',stp:'Durdur',src:'Kaynaklar: harf adları, kalın harfler ve hareke/işaret bilgileri Diyanet ve MEB Kur\'an-ı Kerim öğretim programları ile TDV İslâm Ansiklopedisi ve akademik kaynaklardan derlenmiştir. Ayet metni, Diyanet meali ve ses alquran.cloud (Uthmani metin, Diyanet meali, Mishary Alafasy) üzerinden canlı gelir; metin elle yazılmaz.',g0:'Fatiha',g1:'Kısa sureler',g2:'Kur\'an\'dan dualar'},
en:{hero:'Alif-Ba',sub:'Learn to read the Quran step by step. For every age.',t0:'Letters',t1:'Vowel marks',t2:'Supplications',lr:'Learned',un:'Not yet',pg:'learned',pick:'Tap a letter',s0:'Isolated',s1:'Initial',s2:'Medial',s3:'Final',th:'Heavy letter',in:'Light letter',nj:'Does not join the next letter',jn:'Joins the next letter',hh:'With vowel marks',ld:'Loading…',er:'Could not connect. Check your internet and try again.',open:'Open',close:'Close',all:'Play all',stp:'Stop',src:'Sources: Diyanet and MEB Quran curricula, TDV Encyclopedia of Islam and academic sources. Verse text, Diyanet translation (Turkish) and audio are loaded live from alquran.cloud.',g0:'Al-Fatiha',g1:'Short surahs',g2:'Supplications from the Quran'},
ar:{hero:'الألف باء',sub:'تعلّم قراءة القرآن خطوة بخطوة. لكل الأعمار.',t0:'الحروف',t1:'الحركات',t2:'الأدعية',lr:'تعلّمت',un:'لم أتعلّم',pg:'تم تعلّمه',pick:'اضغط على حرف',s0:'منفصل',s1:'أول',s2:'وسط',s3:'آخر',th:'حرف مفخّم',in:'حرف مرقّق',nj:'لا يتصل بما بعده',jn:'يتصل بما بعده',hh:'مع الحركات',ld:'جارٍ التحميل…',er:'تعذّر الاتصال. تحقّق من الإنترنت وأعد المحاولة.',open:'فتح',close:'إغلاق',all:'استماع للكل',stp:'إيقاف',src:'المصادر: مناهج ديانت ووزارة التربية التركية وموسوعة TDV. نص الآيات والترجمة التركية والصوت من alquran.cloud مباشرة.',g0:'الفاتحة',g1:'السور القصيرة',g2:'أدعية من القرآن'}
};
var lg='tr';try{var l=localStorage.getItem('user_lang');if(T[l])lg=l}catch(e){}
var t=T[lg];document.documentElement.lang=lg;document.documentElement.dir=lg==='ar'?'rtl':'ltr';
var $=function(s){return document.querySelector(s)};
var ST={};try{ST=JSON.parse(localStorage.getItem('elifba_v1'))||{}}catch(e){}
function save(){try{localStorage.setItem('elifba_v1',JSON.stringify(ST))}catch(e){}}
function flip(k){if(ST[k])delete ST[k];else ST[k]=1;save()}
var F='\u064E',K='\u0650',U='\u064F',SK='\u0652',SH='\u0651',T1='\u064B',T2='\u064D',T3='\u064C',ZW='\u200D';
var LET='ا,Elif|ب,Be|ت,Te|ث,Se|ج,Cim|ح,Ha|خ,Hı|د,Dal|ذ,Zel|ر,Ra|ز,Ze|س,Sin|ش,Şın|ص,Sad|ض,Dad|ط,Tı|ظ,Zı|ع,Ayn|غ,Gayn|ف,Fe|ق,Kaf|ك,Kef|ل,Lam|م,Mim|ن,Nun|و,Vav|ه,He|ي,Ye'.split('|').map(function(x){return x.split(',')});
var HEAVY='خصضطظغق',NJ='ادذرزو';
// Dualar: [başlık, [[sure,ayet],...]]
var D=[
[0,'Fatiha',[[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[1,7]]],
[1,'Kevser',[[108,1],[108,2],[108,3]]],
[1,'İhlâs',[[112,1],[112,2],[112,3],[112,4]]],
[1,'Felak',[[113,1],[113,2],[113,3],[113,4],[113,5]]],
[1,'Nâs',[[114,1],[114,2],[114,3],[114,4],[114,5],[114,6]]],
[2,'Rabbenâ âtinâ (Bakara 201)',[[2,201]]],
[2,'Rabbenâ lâ tüâhiznâ (Bakara 286)',[[2,286]]],
[2,'Rabbenâ lâ tüzığ kulûbenâ (Âl-i İmrân 8)',[[3,8]]],
[2,'Rabbenâ zalemnâ (A\'râf 23)',[[7,23]]],
[2,'Rabbirhamhümâ (İsrâ 24)',[[17,24]]],
[2,'Rabbişrah lî sadrî (Tâhâ 25-28)',[[20,25],[20,26],[20,27],[20,28]]],
[2,'Rabbiğfir verham (Mü\'minûn 118)',[[23,118]]],
[2,'Rabbenâ heb lenâ min ezvâcinâ (Furkân 74)',[[25,74]]],
[2,'Rabbi innî limâ enzelte (Kasas 24)',[[28,24]]],
[2,'Rabbiğfir lî ve li-vâlideyye (Nûh 28)',[[71,28]]]
];
var H=[
['Üstün',F,'İnce harfleri "e", kalın harfleri "a" sesiyle okutur.',['ب'+F,'ق'+F,'س'+F]],
['Esre',K,'İnce harfleri "i", kalın harfleri "ı" ile "i" arası bir sesle okutur.',['ب'+K,'ق'+K,'س'+K]],
['Ötre',U,'İnce harfleri "u" ile "ü" arası bir sesle, kalın harfleri "u" sesiyle okutur.',['ب'+U,'ق'+U,'س'+U]],
['Cezim (Sükûn)',SK,'Üstüne geldiği harfi ünlü almadan, yalnızca kendi ünsüz sesiyle (sakin) okutur.',['ب'+F+'ت'+SK,'م'+F+'ن'+SK]],
['Şedde',SH,'Üstüne geldiği harfi iki kez okutur.',['ر'+F+'ب'+SH+F,'ر'+F+'ب'+SH+K]],
['Tenvin',T1+' '+T2+' '+T3,'İki üstün "an/en", iki esre "ın/in", iki ötre "un/ün" okutur. Kelimenin son harfinde bulunur.',['ب'+T1,'ب'+T2,'ب'+T3]],
['Uzatma harfleri (Elif, Vav, Ye)','ا و ي','Üstünden sonra elif, esreden sonra ye, ötreden sonra vav harfi sesi uzatır. Normal (tabiî) uzatma bir elif miktarıdır.',['ب'+F+'ا','ب'+K+'ي','ب'+U+'و']]
];
// ---- iskelet
$('#hero').textContent=t.hero;$('#sub').textContent=t.sub;$('#src').textContent=t.src;
var tb=$('#tabs'),cur=0;
[t.t0,t.t1,t.t2].forEach(function(n,i){var b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.textContent=n;b.onclick=function(){go(i)};tb.appendChild(b)});
function go(i){cur=i;[].forEach.call(tb.children,function(b,j){b.setAttribute('aria-selected',j===i)});for(var j=0;j<3;j++)$('#p'+j).hidden=j!==i;prog()}
function prog(){var n=0,all=0;if(cur===0){all=28;LET.forEach(function(x,i){if(ST['l'+i])n++})}else if(cur===2){all=D.length;D.forEach(function(x,i){if(ST['d'+i])n++})}else{all=0}
var p=$('#pb').parentNode,pt=$('#pt');if(!all){p.hidden=pt.hidden=true;return}p.hidden=pt.hidden=false;$('#pb').style.width=(n*100/all)+'%';pt.textContent=n+' / '+all+' '+t.pg}
// ---- harfler
var sel=-1,P0=$('#p0');
function drawL(){
var h='<div class="grid">';
LET.forEach(function(x,i){h+='<button class="lt'+(i===sel?' on':'')+(ST['l'+i]?' ok':'')+'" data-i="'+i+'"><span class="a ar">'+x[0]+'</span><span class="n">'+x[1]+'</span></button>'});
h+='</div><div id="det"></div>';P0.innerHTML=h;
[].forEach.call(P0.querySelectorAll('.lt'),function(b){b.onclick=function(){sel=+b.dataset.i;drawL();var d=$('#det');if(d&&d.scrollIntoView)d.scrollIntoView({behavior:'smooth',block:'nearest'})}});
var d=$('#det');if(sel<0){d.innerHTML='<p class="sub" style="text-align:center;margin-top:12px">'+t.pick+'</p>';prog();return}
var c=LET[sel][0],nm=LET[sel][1],nj=NJ.indexOf(c)>-1,hv=HEAVY.indexOf(c)>-1;
var ini=nj?c:c+ZW,med=nj?ZW+c:ZW+c+ZW,fin=ZW+c;
d.innerHTML='<div class="card" style="margin-top:12px"><div class="big ar">'+c+'</div><h3 style="text-align:center">'+nm+'</h3>'+
'<div class="bd"><span class="'+(hv?'k':'')+'">'+(hv?t.th:t.in)+'</span><span>'+(nj?t.nj:t.jn)+'</span></div>'+
'<div class="forms"><div><div class="ar">'+c+'</div><small>'+t.s0+'</small></div><div><div class="ar">'+ini+'</div><small>'+t.s1+'</small></div><div><div class="ar">'+med+'</div><small>'+t.s2+'</small></div><div><div class="ar">'+fin+'</div><small>'+t.s3+'</small></div></div>'+
'<div class="gt" style="text-align:center;margin:10px 0 4px">'+t.hh+'</div><div class="hk"><div><div class="ar">'+c+F+'</div></div><div><div class="ar">'+c+K+'</div></div><div><div class="ar">'+c+U+'</div></div></div>'+
'<button class="btn'+(ST['l'+sel]?' o':'')+'" id="lb">'+(ST['l'+sel]?'✓ '+t.un:t.lr)+'</button></div>';
$('#lb').onclick=function(){flip('l'+sel);drawL()};prog()}
// ---- harekeler
(function(){var h='';H.forEach(function(x){h+='<div class="card"><h3>'+x[0]+'</h3><div class="ar" style="font-size:34px;text-align:center;line-height:1.6">'+x[1]+'</div><p class="d">'+x[2]+'</p><div class="hk">';
x[3].forEach(function(e){h+='<div><div class="ar">'+e+'</div></div>'});h+='</div></div>'});$('#p1').innerHTML=h})();
// ---- dualar
var P2=$('#p2'),open={},cache={},au=null,q=[];
function stop(){q=[];if(au){au.pause();au=null}}
function playUrl(u,done){if(au)au.pause();au=new Audio(u);au.onended=done||null;au.play().catch(function(){})}
function load(s,a){var k=s+':'+a;if(!cache[k])cache[k]=fetch('https://api.alquran.cloud/v1/ayah/'+k+'/editions/quran-uthmani,tr.diyanet,ar.alafasy').then(function(r){return r.json()}).then(function(j){if(!j.data||j.data.length<3)throw 0;return{ar:j.data[0].text,tr:j.data[1].text,au:j.data[2].audio}});return cache[k]}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function drawD(){
var h='',last=-1,gn=[t.g0,t.g1,t.g2];
D.forEach(function(x,i){if(x[0]!==last){h+='<div class="gt">'+gn[x[0]]+'</div>';last=x[0]}
h+='<div class="card"><div class="dr"><b>'+x[1]+'</b><button class="pl" data-o="'+i+'">'+(open[i]?t.close:t.open)+'</button></div><div id="d'+i+'"'+(open[i]?'':' hidden')+'></div></div>'});
P2.innerHTML=h;
[].forEach.call(P2.querySelectorAll('[data-o]'),function(b){b.onclick=function(){var i=+b.dataset.o;stop();open[i]=!open[i];drawD();if(open[i])fill(i)}});
D.forEach(function(x,i){if(open[i])fill(i)});prog()}
function fill(i){var box=$('#d'+i),x=D[i];box.innerHTML='<p class="sub">'+t.ld+'</p>';
Promise.all(x[2].map(function(r){return load(r[0],r[1])})).then(function(res){
var h='';res.forEach(function(v,j){h+='<div class="ay"><div class="ar">'+esc(v.ar)+'</div><p>'+esc(v.tr)+'</p><button class="pl" data-a="'+j+'">▶</button></div>'});
h+='<button class="btn o" data-all="1">▶ '+t.all+'</button><button class="btn'+(ST['d'+i]?' o':'')+'" data-lr="1">'+(ST['d'+i]?'✓ '+t.un:t.lr)+'</button>';
box.innerHTML=h;
[].forEach.call(box.querySelectorAll('[data-a]'),function(b){b.onclick=function(){stop();playUrl(res[+b.dataset.a].au)}});
box.querySelector('[data-all]').onclick=function(){stop();q=res.map(function(v){return v.au});(function nx(){var u=q.shift();if(u)playUrl(u,nx)})()};
box.querySelector('[data-lr]').onclick=function(){flip('d'+i);drawD()}
}).catch(function(){box.innerHTML='<p class="sub">'+t.er+'</p>'})}
// ---- tema
var th=$('#th');
function applyTheme(m){document.documentElement.classList.toggle('light-mode',m==='light');var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=m==='light'?'#f1f5f9':'#0f172a'}
var m0='';try{m0=localStorage.getItem('theme')||''}catch(e){}
if(m0!=='light'&&m0!=='dark')m0=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
applyTheme(m0);
th.onclick=function(){m0=m0==='light'?'dark':'light';try{localStorage.setItem('theme',m0)}catch(e){}applyTheme(m0)};
drawL();drawD();go(0);
})();
</script>
</body>
</html>
