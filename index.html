function cl(s){return'<div class="cl">'+s.split('').map(function(c){return'<span class="ar">'+c+'</span>'}).join('')+'</div>'}
(function(){
var cards=[
['Kalın, ince ve peltek harfler','<p class="d">Kalın harfler (7): '+cl('خصضطظغق')+'İnce harfler: '+cl('ابتثجحدذرزسشعفكلمنوهي')+'Peltek harfler (3): '+cl('ثذظ')+'<small class="m">Peltek harflerden ث ve ذ ince, ظ kalındır.</small></p><p class="d">Ra (ر): ince seslidir ancak harekesi üstün veya ötre olduğunda kalın, esre olduğunda ince okunur.</p>'],
['Bitişmeyen harfler','<p class="d">Bu altı harf kelime içinde kendinden sonraki harfe bitişmez; ortada ve sondaki yazılışları aynıdır:</p>'+cl('ادذرزو')],
['Elif lâm takısı','<p class="d">Arapçada isimleri belirli yapar. Kamerî harften önce lâm cezimli okunur. Şemsî harften önce lâm yazılır ama okunmaz, sonraki harf şeddeli okunur.</p><p class="d">Kamerî harfler (14):</p>'+cl(KAM)+'<p class="d">Şemsî harfler (14):</p>'+cl(SEM)+'<div class="ex"><div><div class="ar">اَلْقَمَرُ</div><small>el-kameru (lâm okunur)</small></div><div><div class="ar">اَلشَّمْسُ</div><small>eş-şemsü (lâm okunmaz)</small></div></div><p class=\"d\">Şemsî harf nun ise, nundaki gunne sıfatı nedeniyle bir buçuk elif tutularak okunur.</p><div class=\"ex\"><div><div class=\"ar\">اَلنَّجْمِ</div><small>en-necmi (bir buçuk elif)</small></div></div>'],
['Lafzatullah','<p class="d">Allah lafzındaki lâm (ل) harfi: kendinden önceki harfin harekesi üstün veya ötre ise kalın okunur. Esre ise ince okunur.</p>'],
['Zamir (ـهُ ـهِ)','<p class="d">Kelime sonundaki he (ه) zamirdir. Kendinden önceki harf harekeliyse zamir uzatılarak, cezimli veya sakinse uzatılmadan okunur.</p><div class="ex"><div><div class="ar">مَالُهُ</div><small>mâlühû (uzatılır)</small></div><div><div class="ar">عَنْهُ</div><small>anhu (uzatılmaz)</small></div></div>'],
['Med ve kasır','<p class="d">Mushaflarda bazı kelimelerin altında küçük ve eğik yazılmış "med" veya "kasır" ibaresi bulunur. Med: harf uzatılarak okunur. Kasır: harf uzatılmadan okunur.</p>'],
['Okunmayan elif','<p class="d">Bazı yerlerde harekesiz elif yazıldığı hâlde okunmaz. Elif lâm takısındaki elif, kendinden önce bir harf geldiğinde okunmaz. Örnekte ilk elif uzatma yapar, sondaki elifin okunuşa etkisi yoktur.</p><div class="ex"><div><div class="ar">كَانُوا</div><small>kânû</small></div></div>'],
['Hurufımukattaa','<p class="d">29 surenin başında bulunan, kelime oluşturmayan müstakil harflerdir. Harekesiz yazılır, isimleriyle okunur. 14 harften oluşur:</p>'+cl('احرسصطعقكلمنهي')+'<div class="ex"><div><div class="ar">الٓمٓ</div><small>elif lâm mîm</small></div></div><p class="m">Bakara, Âl-i İmrân, A\'râf, Yûnus, Hûd, Yûsuf, Ra\'d, İbrâhîm, Hicr, Meryem, Tâhâ, Şuarâ, Neml, Kasas, Ankebût, Rûm, Lokmân, Secde, Yâsîn, Sâd, Mü\'min, Fussilet, Şûrâ, Zuhruf, Duhân, Câsiye, Ahkâf, Kâf ve Kalem surelerinin başında bulunur.</p>'],
['Med çeşitleri (uzatma)','<p class="d">Med harfleri elif, vav ve yedir. Med harfinden sonra gelen duruma göre uzatmanın çeşidi ve miktarı değişir. Bir elif miktarı, bir parmağı kaldırıp indirme süresi kadardır.</p><p class="m">Uzatma ölçüleri okuyuş hızına ve öğretmenin okuyuşuna göre değişebilir. En doğrusu hocadan dinleyerek öğrenmektir. Aşağıdaki çeşitlerden ilk üçü 5. sınıf, ârız, lâzım ve lîn ise 6-7. sınıf Kur’an-ı Kerim programındadır.</p>'],
['Medd-i tabiî','<p class="d">Med harfinden sonra hemze veya sükûn gelmezse olur.</p><p class="d"><b>Miktar:</b> Bir elif.</p><div class="ex"><div><div class="ar">قَالَ</div><small>kâ harfi bir elif uzatılır</small></div></div>'],
['Medd-i muttasıl','<p class="d">Med harfinden sonra hemze aynı kelimede gelirse olur.</p><p class="d"><b>Miktar:</b> Dört elif. Hızlı okuyuşta en az iki elif. Uzatmak vaciptir.</p><div class="ex"><div><div class="ar">شُرَكَاءَ</div><small>kâf harfi uzatılır</small></div></div>'],
['Medd-i munfasıl','<p class="d">Med harfi bir kelimenin sonunda, hemze ise sonraki kelimenin başında bulunursa olur.</p><p class="d"><b>Miktar:</b> Dört elif. Hızlı okuyuşta bir elife inilebilir. Uzatmak caizdir, vacip değildir.</p><div class="ex"><div><div class="ar">قَالُوا آمَنَّا</div><small>lâm harfi uzatılır</small></div></div>'],
['Medd-i ârız','<p class="d">Med harfinden sonra gelen harekeli harfte durulunca geçici (ârız) sükûn oluşur. Genelde âyet sonlarında ve durak işaretlerinde görülür.</p><p class="d"><b>Miktar:</b> Dört elif. Hızlı okuyuşta en az bir elif. Durulmayıp devam edilirse harf harekesiyle okunur ve bir elif uzatılır.</p><div class="ex"><div><div class="ar">الْمُرْسَلِينَ</div><small>sonunda durulursa lâm harfi uzatılır</small></div></div>'],
['Medd-i lâzım','<p class="d">Med harfinden sonra kalıcı (lâzimî) sükûn, yani cezimli veya şeddeli harf gelirse olur.</p><p class="d"><b>Miktar:</b> Normal okuyuşta dört elif. Hızlı okuyuşta en az üç elif.</p><div class="ex"><div><div class="ar">الْضَّالِّينَ</div><small>dâd harfi uzatılır</small></div></div>'],
['Medd-i lîn','<p class="d">Üstün harekeden sonra gelen cezimli vav veya ye (lîn harfleri) arkasından sükûn gelirse olur. Uzatma harekede değil, lîn harfinde yapılır.</p><p class="d"><b>Miktar:</b> Üç elif. Hızlı okuyuşta, sükûn ârız ise bir elife kadar inilebilir. Kur’an’da lâzimî sükûnlu lîn yalnızca iki yerde vardır (Meryem ve Şûrâ surelerinin başındaki ayn harfi), orada en az iki elif.</p><div class="ex"><div><div class="ar">مِنْ خَوْفٍ</div><small>vav harfi üç elif uzatılır</small></div></div>'],
['Tenvin ve sakin nun kuralları','<p class=\"d\">Tenvin: kelimenin sonuna gelen iki üstün, iki esre veya iki ötredir. Cezimli nun sesi verir, bu nun yazıda görünmez. Sakin nun: kelimenin ortasında veya sonunda bulunan cezimli nundur.</p><p class=\"d\">Bir kelimede tenvin veya sakin nun varsa dört kuraldan biri mutlaka bulunur: ihfa, izhar, iklab ve idgam. Gunne, sesin genizden (burun boşluğundan) getirilmesidir.</p>'],
['İhfa','<p class=\"d\">Tenvin veya sakin nundan sonra şu 15 harften biri gelirse ihfa olur:</p>'+cl('تثجدذزسشصضطظفقك')+'<p class=\"d\">Dil ucu serbest bırakılır, nunun mahrecine değmez. Ses genizden getirilir (gunneli) ve bir elif miktarı tutulur.</p><div class=\"ex\"><div><div class=\"ar\">سَلَامٌ قَوْلًا</div><small>tenvinden sonra kâf: ihfa</small></div></div>'],
['İzhar','<p class=\"d\">Tenvin veya sakin nundan sonra şu 6 boğaz harfinden biri gelirse izhar olur:</p>'+cl('احخعغه')+'<p class=\"d\">Nun, asıl mahrecinden açıkça okunur. Gunne yapılmaz, nun tutulmadan hemen sonraki harfe geçilir.</p><div class=\"ex\"><div><div class=\"ar\">مَنْ آمَنَ</div><small>sakin nundan sonra elif: izhar</small></div></div>'],
['İklab','<p class=\"d\">Tenvin veya sakin nundan sonra be (ب) harfi gelirse nun sesi mim sesine çevrilir. Dudaklar bastırılmadan mim sesi genizden getirilir (gunneli) ve bir buçuk elif miktarı tutulur.</p><div class=\"ex\"><div><div class=\"ar\">سَمِيعٌ بَصِيرٌ</div><small>tenvinden sonra be: iklab</small></div></div>'],
['İdgam (tenvin ve sakin nun ile)','<p class=\"d\"><b>Gunneli idgam (idgam-ı mea’l-gunne):</b> Tenvin veya sakin nundan sonra şu 4 harften biri gelirse olur:</p>'+cl('ينمو')+'<p class=\"d\">Tenvin veya sakin nun, sonraki harfe katılır; harf şeddeli ve gunneli okunur, bir buçuk elif tutulur.</p><div class=\"ex\"><div><div class=\"ar\">مَنْ يَعْمَلْ</div><small>sakin nundan sonra ye: gunneli idgam</small></div></div><p class=\"d\"><b>Gunnesiz idgam (idgam-ı bila-gunne):</b> Tenvin veya sakin nundan sonra lâm veya ra gelirse olur:</p>'+cl('لر')+'<p class=\"d\">Tenvin veya sakin nun sonraki harfe katılır ve harf şeddeli okunur. Gunne yapılmaz.</p><div class=\"ex\"><div><div class=\"ar\">مُحَمَّدٌ رَسُولُ</div><small>tenvinden sonra ra: gunnesiz idgam</small></div></div><p class=\"m\">Gunneli idgamda nun ile idgam harfinin farklı kelimelerde olması şarttır. Aynı kelimede ise idgam yapılmaz, izhar edilir. Örnekler:</p><div class=\"ex\"><div class=\"ar\">دُنْيَا</div><div class=\"ar\">قِنْوَانٌ</div><div class=\"ar\">صِنْوَانٌ</div><div class=\"ar\">بُنْيَانٌ</div></div>'],
['İdgam çeşitleri','<p class=\"d\">İdgam, benzer veya yakın iki harften sakin olan birincisinin, harekeli ikinciye katılıp şeddeli okunmasıdır. İdgamın olması için harfler birbirinin aynı veya mahreç ya da sıfat bakımından benzer ya da yakın olmalı, birincisi sakin ikincisi harekeli olmalı, harfler yan yana olmalı ve aralarına idgamı engelleyen başka bir harf girmemelidir.</p><p class=\"d\">Altı çeşit idgam vardır: ikisi tenvin ve sakin nunla (gunneli, gunnesiz), üçü diğer harflerle (misleyn, mütecaniseyn, mütekaribeyn), biri elif lâm takısından sonra (şemsiyye) olur. İlk ikisi ile şemsiyye yukarıdaki kartlarda var.</p>'],
['İdgam-ı misleyn','<p class=\"d\">Mahreçleri ve sıfatları aynı olan iki harften birincisi cezimli, ikincisi harekeli olarak bir araya gelirse olur. Birinci harf ikinciye katılır ve şeddeli okunur, harflerin arası ayrılmaz.</p><p class=\"d\">Mim ve nun ile olursa gunneli, bir buçuk elif tutularak okunur (şeddeli nun ve şeddeli mim de bu gruptandır). Diğer harflerle olursa gunne yapılmaz, harfler tutulmaz.</p><div class=\"ex\"><div><div class=\"ar\">اِضْرِبْ بِعَصَاكَ</div><small>cezimli be, harekeli be’ye katılır</small></div></div>'],
['İdgam-ı mütecaniseyn','<p class=\"d\">Mahreçleri bir, sıfatları farklı iki harften birincisi sakin, ikincisi harekeli gelirse olur. Birinci harf ikinciye katılır ve şeddeli okunur. Harfler üç grupta toplanır, idgam her grubun kendi içinde olur:</p>'+cl('تدط')+''+cl('ثذظ')+''+cl('بم')+'<div class=\"ex\"><div><div class=\"ar\">إِذْ هَمَّتْ طَائِفَتَانِ</div><small>cezimli te, harekeli tı’ya katılır; te sesi çıkarılmaz</small></div></div>'],
['İdgam-ı mütekaribeyn','<p class=\"d\">Mahreç ve sıfatları birbirine yakın harflerin katılarak okunmasıdır. Sakin olan birinci harf, harekeli ikinciye katılır ve şeddeli okunur. İki grup vardır:</p>'+cl('لر')+''+cl('قك')+'<div class=\"ex\"><div><div class=\"ar\">بَلْ رَفَعَهُ</div><small>cezimli lâm, ra’ya katılır; lâm okunmaz</small></div></div><p class=\"m\">Lâm ile ra arasında idgam için lâmın önce gelmesi gerekir. Ra önce gelirse idgam yapılmaz. Örnekler:</p><div class=\"ex\"><div><div class=\"ar\">رَبَّنَا اغْفِرْ لِي</div><small>ra önce: idgam yok</small></div></div><div class=\"ex\"><div><div class=\"ar\">وَاسْتَغْفِرْ لِذَنْبِكَ</div><small>ra önce: idgam yok</small></div></div><p class=\"m\">Kaf ve kef grubunun Kur’an’da tek örneği Mürselât suresinin 20. ayetindeki “نَخْلُقْكُمْ” kelimesidir.</p>'],
['Durak (vakıf) işaretleri','<p class=\"d\">Vakıf, Kur’an okurken bir kelimenin sonunda durup nefes almak ve sonra okumaya devam etmektir. Durak işaretlerine secâvend denir. Okunan yerin anlamı gözetilerek konulmuşlardır ve Türkçedeki noktalama işaretlerine benzer. Aşağıdaki altı işaret Türkiye dahil birçok ülkenin mushaflarında kullanılır.</p><div style=\"display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border-color)\"><div class=\"ar\" style=\"font-size:2rem;min-width:52px;text-align:center\">م</div><div><b>Vakf-ı lâzım</b><p class=\"m\" style=\"margin:0\">Durmak gerekir. Geçilirse anlam bozulabilir.</p></div></div><div style=\"display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border-color)\"><div class=\"ar\" style=\"font-size:2rem;min-width:52px;text-align:center\">ط</div><div><b>Vakf-ı mutlak</b><p class=\"m\" style=\"margin:0\">Söz tamam olduğu yerde bulunur. Durmak evlâdır, geçmek de caizdir.</p></div></div><div style=\"display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border-color)\"><div class=\"ar\" style=\"font-size:2rem;min-width:52px;text-align:center\">ج</div><div><b>Vakf-ı câiz</b><p class=\"m\" style=\"margin:0\">Durmak evlâdır, geçmek de caizdir.</p></div></div><div style=\"display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border-color)\"><div class=\"ar\" style=\"font-size:2rem;min-width:52px;text-align:center\">ز</div><div><b>Vakf-ı mücevvez</b><p class=\"m\" style=\"margin:0\">Geçmek evlâdır, durmak da caizdir. Durulursa geriden alınmaz.</p></div></div><div style=\"display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border-color)\"><div class=\"ar\" style=\"font-size:2rem;min-width:52px;text-align:center\">ص</div><div><b>Vakf-ı murahhas</b><p class=\"m\" style=\"margin:0\">Geçmek evlâdır. Ayet uzun olup nefes yetmezse durulabilir. Durulursa geriden alınmaz.</p></div></div><div style=\"display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border-color)\"><div class=\"ar\" style=\"font-size:2rem;min-width:52px;text-align:center\">لا</div><div><b>Vakf-ı lâ</b><p class=\"m\" style=\"margin:0\">Anlam bağlı olduğu için durmak uygun değildir. Durulursa geriden alınarak devam edilir. Ayet sonunda ise geriden almaya gerek yoktur.</p></div></div><p class=\"m\">Bazı mushaflarda başka durak işaretleri de bulunabilir; işaretler mushaflar arasında farklılık gösterebilir. Hocanın okuyuşuna ve elindeki mushafın açıklamasına uy.</p>']
];

function p3(n){return(n<10?'00':n<100?'0':'')+n}
function loadEx(i){var e=EX[i],box=$('#ekw');if(!box)return;
load(e[0],e[1]).then(function(v){var w=v.ar.split(' ')[e[2]-1]||'';if(!w||norm(w).charAt(0)!==LET[i][0]){box.innerHTML='';return}
box.innerHTML='<div><div class="ar">'+esc(w)+'</div><small>'+e[3]+'</small><button class="pl" id="eb1">▶ '+t.kw+'</button> <button class="pl" id="eb2">▶ '+t.ay+'</button></div><p class="sg" style="width:100%;text-align:center">'+t.ekn+'</p>';
$('#eb1').onclick=function(){stop();playUrl('https://audio.qurancdn.com/wbw/'+p3(e[0])+'_'+p3(e[1])+'_'+p3(e[2])+'.mp3')};
$('#eb2').onclick=function(){stop();playUrl(v.au)}}).catch(function(){box.innerHTML=''})}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function drawD(){
var h='',last=-1,gn=[t.g0,t.g1,t.g2];
D.forEach(function(x,i){if(x[0]!==last){h+='<div class="gt">'+gn[x[0]]+'</div>';last=x[0]}
h+='<div class="card"><div class="dr"><b>'+x[1]+'</b><button class="pl" data-o="'+i+'">'+(open[i]?t.close:t.open)+'</button></div><div id="d'+i+'"'+(open[i]?'':' hidden')+'></div></div>'});
P3.innerHTML='<p class="m">'+t.okc+'</p>'+h;
[].forEach.call(P3.querySelectorAll('[data-o]'),function(b){b.onclick=function(){var i=+b.dataset.o;stop();open[i]=!open[i];drawD();if(open[i])fill(i)}});
D.forEach(function(x,i){if(open[i])fill(i)});prog()}
function fill(i){var box=$('#d'+i),x=D[i];box.innerHTML='<p class="m">'+t.ld+'</p>';
Promise.all(x[2].map(function(r){return load(r[0],r[1])})).then(function(res){
var h='',miss=false;res.forEach(function(v,j){var k=x[2][j][0]+':'+x[2][j][1],o=OKU[k];if(!o)miss=true;h+='<div class="ay"><div class="ar">'+esc(v.ar)+'</div>'+(o?'<p class="ok2"><b>'+(PFX[k]?t.oku2:t.oku)+':</b> '+esc(o)+'</p>':'')+'<p>'+esc(v.tr)+'</p><button class="pl" data-a="'+j+'">▶</button></div>'});if(miss)h+='<p class="m">'+t.okn+'</p>';
h+='<button class="btn o" data-all="1">▶ '+t.all+'</button><button class="btn'+(ST['d'+i]?' o':'')+'" data-lr="1">'+(ST['d'+i]?'✓ '+t.un:t.lr)+'</button>';
box.innerHTML=h;
[].forEach.call(box.querySelectorAll('[data-a]'),function(b){b.onclick=function(){stop();playUrl(res[+b.dataset.a].au)}});
box.querySelector('[data-all]').onclick=function(){stop();q=res.map(function(v){return v.au});(function nx(){var u=q.shift();if(u)playUrl(u,nx)})()};
box.querySelector('[data-lr]').onclick=function(){flip('d'+i);drawD()}
}).catch(function(){box.innerHTML='<p class="m">'+t.er+'</p>'})}
// ---- alıştırma
var P4=$('#p4'),qm=-1,qi=0,qs=0,cq=null,qk=0,QN=10;
function rnd(n){return Math.floor(Math.random()*n)}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),x=a[i];a[i]=a[j];a[j]=x}return a}
function uq(c,g,n){var o=[c],k=0;while(o.length<n&&k++<80){var x=g();if(o.indexOf(x)<0)o.push(x)}return shuf(o)}
var POOLR=[];LET.forEach(function(x,i){if(APX.indexOf(x[0])<0)POOLR.push(i)});
var QMK=[F,K,U,SK,SH],IH='تثجدذزسشصضطظفقك',IZ='احخعغه',ID='ينمولر',VS=['م','ط','ج','ز','ص','لا'],MDW=['قَالَ','شُرَكَاءَ','قَالُوا آمَنَّا','الْمُرْسَلِينَ','الْضَّالِّينَ','مِنْ خَوْفٍ'];
function sp(z){return z.split('').join(' ')}
function genQ(k){var i=rnd(28),c=LET[i][0],o,r;
if(k===0){o=uq(LET[i][1],function(){return LET[rnd(28)][1]},4);return{sh:'<div class="big ar">'+c+'</div>',op:o,ok:o.indexOf(LET[i][1]),ex:''}}
if(k===1){o=uq(c,function(){return LET[rnd(28)][0]},4);return{sh:'<div class="hero" style="font-size:2rem;margin:10px 0">'+LET[i][1]+'</div>',op:o,ok:o.indexOf(c),ar:1,ex:''}}
if(k===2){i=POOLR[rnd(POOLR.length)];c=LET[i][0];var v=rnd(3);r=reads(c,LET[i][2])[v];o=uq(r,function(){var q=POOLR[rnd(POOLR.length)];return reads(LET[q][0],LET[q][2])[rnd(3)]},4);return{sh:'<div class="big ar">'+c+[F,K,U][v]+'</div>',op:o,ok:o.indexOf(r),ex:(c==='ر'?t.ra:(HEAVY.indexOf(c)>-1?t.lg2:t.lg1))}}
if(k===3){var m=rnd(5);o=uq(t.mk[m],function(){return t.mk[rnd(5)]},4);return{sh:'<div class="big ar">'+c+QMK[m]+'</div>',op:o,ok:o.indexOf(t.mk[m]),ex:''}}
if(k===4){while(c==='ر'){i=rnd(28);c=LET[i][0]}var h=HEAVY.indexOf(c)>-1;return{sh:'<div class="big ar">'+c+'</div>',op:[t.th,t.inc],ok:h?0:1,ex:t.kl+' '+sp(HEAVY)}}
if(k===5){var n=NJ.indexOf(c)>-1;return{sh:'<div class="big ar">'+c+'</div>',op:[t.jn,t.nj],ok:n?1:0,ex:t.bl+' '+sp(NJ)}}
if(k===8){var mi=rnd(6),mo=uq(t.mdn[mi],function(){return t.mdn[rnd(6)]},4);return{sh:'<div class="ar" style="font-size:2.6rem;line-height:1.7">'+MDW[mi]+'</div>',op:mo,ok:mo.indexOf(t.mdn[mi]),ex:t.mdr[mi]}}
if(k===10){var vi=rnd(6),vo=uq(t.dkn[vi],function(){return t.dkn[rnd(6)]},4);return{sh:'<div class="ar" style="font-size:3.4rem;line-height:1.5">'+VS[vi]+'</div>',op:vo,ok:vo.indexOf(t.dkn[vi]),ex:t.dkr[vi]}}
if(k===9){var nc=LET[rnd(28)][0],ri=IH.indexOf(nc)>-1?0:IZ.indexOf(nc)>-1?1:nc==='ب'?2:3;return{sh:'<div class="big ar">'+nc+'</div>',op:t.nk,ok:ri,ex:t.nk[0]+': '+sp(IH)+' · '+t.nk[1]+': '+sp(IZ)+' · '+t.nk[2]+': ب · '+t.nk[3]+': '+sp(ID)}}
var km=KAM.indexOf(c)>-1;return{sh:'<div class="big ar">'+c+'</div>',op:[t.km,t.sm],ok:km?0:1,ex:t.kam+' '+sp(KAM)+' · '+t.sem+' '+sp(SEM)}}
function drawQ(){
if(qm<0){var h='<p class="m" style="margin-bottom:10px">'+t.qnote+'</p>';[0,1,2,3,4,5,6,8,9,10,7].forEach(function(k){var n=t.qm[k],b=ST['qb'+k];h+='<button class="btn o" data-m="'+k+'" style="text-align:start">'+n+(b?' · '+t.qbest+': '+b+'/'+QN:'')+'</button>'});P4.innerHTML=h;
[].forEach.call(P4.querySelectorAll('[data-m]'),function(b){b.onclick=function(){qm=+b.dataset.m;qi=0;qs=0;nextQ()}});return}
if(qi>=QN){var bk='qb'+qm;if(!ST[bk]||qs>ST[bk]){ST[bk]=qs;save()}
P4.innerHTML='<div class="card" style="text-align:center"><h3>'+t.qs+'</h3><div class="hero" style="font-size:2.4rem;margin:8px 0">'+qs+' / '+QN+'</div><button class="btn" id="qa">'+t.qa+'</button><button class="btn o" id="ql">'+t.ql+'</button></div>';
$('#qa').onclick=function(){qi=0;qs=0;nextQ()};$('#ql').onclick=function(){qm=-1;drawQ()};return}
}
function nextQ(){if(qi>=QN){drawQ();return}
qk=qm===7?[0,1,2,3,4,5,6,8,9,10][rnd(10)]:qm;cq=genQ(qk);
var h='<div class="card"><p class="m">'+t.qr+' '+(qi+1)+' / '+QN+' · '+t.qd+': '+qs+'</p><h3>'+t.qp[qk]+'</h3><div style="text-align:center">'+cq.sh+'</div><div class="qo">';
cq.op.forEach(function(x,j){h+='<button class="qb'+(cq.ar?' ar':'')+'" data-o="'+j+'">'+x+'</button>'});
h+='</div><div id="qf" class="qf"></div></div><button class="btn o" id="ql2" style="margin-top:10px">'+t.ql+'</button>';
P4.innerHTML=h;
$('#ql2').onclick=function(){qm=-1;drawQ()};
[].forEach.call(P4.querySelectorAll('[data-o]'),function(b){b.onclick=function(){var j=+b.dataset.o,ok=j===cq.ok;
[].forEach.call(P4.querySelectorAll('[data-o]'),function(x){x.disabled=true;if(+x.dataset.o===cq.ok)x.classList.add('ok')});
if(ok)qs++;else b.classList.add('no');
$('#qf').innerHTML='<b>'+(ok?t.qc:t.qw+cq.op[cq.ok])+'</b>'+(cq.ex?'<p class="m">'+cq.ex+'</p>':'')+'<button class="btn" id="qn">'+(qi+1>=QN?t.qf:t.qn)+'</button>';
$('#qn').onclick=function(){qi++;nextQ()}}})}
// ---- tema
var thb=$('#th');
function thIcon(){thb.textContent=document.documentElement.classList.contains('light-mode')?'☀️':'🌙'}
thb.onclick=function(){var l=document.documentElement.classList.toggle('light-mode');localStorage.setItem('theme',l?'light':'dark');window.syncSurface(localStorage.getItem('custom_bg'));var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',localStorage.getItem('custom_bg')||(l?'#f8fafc':'#0b1120'));thIcon()};
thIcon();
drawL();drawD();drawQ();go(0);
})();
</script>
